# Area descriptions for tools/build_index.py (display order = file order). Not packaged.
framework: "What ros2_control is: controller manager, resource manager, hardware components, controllers and their interfaces; controller lifecycle states and transitions"
setup: "Controller YAML (controller_manager, update_rate, types, forward_command_controller, JTC parameters), the <ros2_control> URDF tag, simulation and real-hardware launch files, spawner order"
manager: "ros2 control CLI (list_controllers, list_controller_types, set_controller_state, load/unload, switch_controllers), controller_manager services, spawner"
hardware: "Writing a hardware interface: SystemInterface methods, on_init params, exporting interfaces, read/write, pluginlib export, CMake and package.xml; Dynamixel example with dynamixel_workbench"
learn: "ros2_control course units 1–5 for students (rrbot demo, bringup package, controller manager, hardware template, Dynamixel) and the course map; open only for course questions"
migration: "Humble hardware interface API and other Humble differences; Jazzy → Kilted/Lyrical removals and default changes; open for other distros or porting"
