# Area descriptions for tools/build_index.py (display order = file order). Not packaged.
build-run: "environment & sourcing, workspaces, setup.py/CMakeLists/package.xml, rosdep, colcon, launch files"
core-api: "rclpy/rclcpp node skeleton, logging, --ros-args, time & timers, parameters, executors & callback groups"
communication: "topics, services and actions (rclpy/rclcpp templates, CLI), custom and standard interfaces (msg/srv/action), message_filters sync"
middleware: "QoS policies, events and demos (durability, deadline, lifespan, liveliness), DDS and RMW choice, ros2 daemon, multi-host DDS"
security: "SROS2 / DDS-Security: keystore and CA, enclaves, policy XML and generate_artifacts, governance and permissions, openssl checks, ROS_SECURITY_* variables"
recipes: "mobile-robot code patterns: LaserScan sectors & avoidance, odometry go-to-goal, command state machine, cv_bridge, safe stop"
tools: "TF2, URDF/xacro/robot_state_publisher, rosbag2, lifecycle nodes, debugging (doctor, rqt, RViz2, tracing), CLI cheat sheet"
architecture: "naming & design rules, composition, testing/CI/Docker, launch_testing, layers & failures, Nav2, MoveIt2, ros2_control, perception, Gazebo, Isaac Sim, multi-robot"
learn: "course track for students (Leo rover): concepts and Units 2–8 exercises; open only for course questions"
learn-intermediate: "intermediate course (MP-400 simulation): Units 2–9 examples and exercises, final project; open only for course questions"
learn-security: "security course (TurtleBot3 simulation): keystore and enclaves for Gazebo and teleop, a secured cmd_vel listener; open only for course questions"
migration: "Humble → Jazzy → Lyrical changes and a migration checklist; open for other distros or porting"
