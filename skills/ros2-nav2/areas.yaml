# Area descriptions for tools/build_index.py (display order = file order). Not packaged.
bringup: "Nav2 architecture and servers, nav2_lifecycle_manager (node_names, autostart, bonds, manage_nodes), single launch file, RViz2 displays"
mapping: "occupancy grid maps, SLAM, cartographer_ros launch and Lua options, map_saver_cli, map_server"
localization: "AMCL concepts, launch and parameters, initial pose (RViz, config file, node), global localization"
planning-control: "planner_server (NavFn), controller_server (DWB, RPP, progress and goal checkers, critics), behavior_server, goals from CLI and Python"
behavior-trees: "bt_navigator, behavior tree XML, Nav2 BT control/action nodes, plugin_lib_names, custom trees (low battery), how recoveries are triggered"
costmaps: "global vs local costmap, static/inflation/obstacle/voxel layers, robot_radius vs footprint, costmap filters (keepout zones, speed limits)"
commander: "nav2_simple_commander BasicNavigator (goToPose, followWaypoints), NavigateToPose action, waypoint_follower, warehouse demos"
plugins: "writing Nav2 plugins: costmap layer, global planner, controller (base classes, plugin XML, CMake, package.xml, configuration)"
multi-robot: "Nav2 for several robots with namespaces: mapping, AMCL, per-robot YAML, launch files, RViz"
learn: "course tracks for students: intro course (TurtleBot3, Units 1–6, project) and advanced course (warehouse, Units 1–4); open only for course questions"
migration: "Humble → Jazzy → Lyrical Nav2 changes and a migration checklist; open for other distros or porting"
